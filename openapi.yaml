openapi: 3.1.0
info:
  title: Mattis Stats API
  version: 1.0.0
  description: |
    API for tracking player statistics for the card game "Mattis".

    **Key Features**:
    - Manage players.
    - Record game rounds and identify a single loser.
    - Grant and revoke special "Fettmattis".
    - View leaderboards for regular play (loss percentage) and Fettmattis.

    **Authentication**:
    - Operations require either a bearer token or a signed session cookie.
    - Authentication endpoints establish or revoke sessions for clients that are not yet authenticated.
    - The contract defines both a bearer token scheme for API clients and a cookie-based scheme
      for browser sessions. Use the `bearerAuth` security requirement when automating requests
      or calling protected resources from non-browser clients, and the `sessionCookie` requirement
      when an endpoint expects the signed session cookie provided by BetterAuth during interactive
      login flows.

    **Error Handling**:
    - The API uses RFC 9457 for problem details in error responses.
  contact:
    name: Kenneth Aasan
    email: kenneth@aasan.dev
servers:
  - url: /api
    x-internal: false
tags:
  - name: Authentication
    description: Session and sign-in workflows.
  - name: Players
    description: Player roster management.
  - name: Rounds
    description: Round recording and history.
  - name: Fettmattis
    description: Fettmattis awards and revocations.
  - name: Leaderboards
    description: Leaderboard and season statistics.
security:
  - bearerAuth: []
  - sessionCookie: []
paths:
  /auth/get-session:
    get:
      summary: Get Current Session
      description: Returns the active session when a valid session cookie is present.
      operationId: getSession
      tags:
        - Authentication
      security:
        - sessionCookie: []
      responses:
        "200":
          description: The current session details or null when no session is available.
          headers:
            RateLimit-Limit:
              $ref: "#/components/headers/RateLimit-Limit"
            RateLimit-Remaining:
              $ref: "#/components/headers/RateLimit-Remaining"
            RateLimit-Reset:
              $ref: "#/components/headers/RateLimit-Reset"
            Access-Control-Allow-Origin:
              $ref: "#/components/headers/Access-Control-Allow-Origin"
          content:
            application/json:
              schema:
                oneOf:
                  - $ref: "#/components/schemas/AuthSession"
                  - type: "null"
        "400":
          $ref: "#/components/responses/BadRequest"
        "401":
          $ref: "#/components/responses/Unauthorized"
        "429":
          $ref: "#/components/responses/TooManyRequests"
        "500":
          $ref: "#/components/responses/InternalServerError"

  /auth/sign-in/email:
    post:
      summary: Sign In with Email
      description: Authenticates a user using email and password credentials.
      operationId: signInWithEmail
      tags:
        - Authentication
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/EmailPasswordSignInRequest"
      responses:
        "200":
          description: Session token and user details for the authenticated user.
          headers:
            RateLimit-Limit:
              $ref: "#/components/headers/RateLimit-Limit"
            RateLimit-Remaining:
              $ref: "#/components/headers/RateLimit-Remaining"
            RateLimit-Reset:
              $ref: "#/components/headers/RateLimit-Reset"
            Access-Control-Allow-Origin:
              $ref: "#/components/headers/Access-Control-Allow-Origin"
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/EmailPasswordSignInResponse"
        "400":
          $ref: "#/components/responses/BadRequest"
        "401":
          $ref: "#/components/responses/Unauthorized"
        "403":
          $ref: "#/components/responses/Forbidden"
        "429":
          $ref: "#/components/responses/TooManyRequests"
        "500":
          $ref: "#/components/responses/InternalServerError"

  /auth/sign-out:
    post:
      summary: Sign Out
      description: Terminates the current session and clears the associated cookies.
      operationId: signOut
      tags:
        - Authentication
      security:
        - sessionCookie: []
      responses:
        "200":
          description: Confirmation that the session was terminated.
          headers:
            RateLimit-Limit:
              $ref: "#/components/headers/RateLimit-Limit"
            RateLimit-Remaining:
              $ref: "#/components/headers/RateLimit-Remaining"
            RateLimit-Reset:
              $ref: "#/components/headers/RateLimit-Reset"
            Access-Control-Allow-Origin:
              $ref: "#/components/headers/Access-Control-Allow-Origin"
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/SignOutResponse"
        "400":
          $ref: "#/components/responses/BadRequest"
        "401":
          $ref: "#/components/responses/Unauthorized"
        "429":
          $ref: "#/components/responses/TooManyRequests"
        "500":
          $ref: "#/components/responses/InternalServerError"
  /players:
    get:
      summary: List Players
      description: Returns all players, ordered by display name.
      operationId: listPlayers
      tags:
        - Players
      responses:
        "200":
          description: A list of players.
          headers:
            RateLimit-Limit:
              $ref: "#/components/headers/RateLimit-Limit"
            RateLimit-Remaining:
              $ref: "#/components/headers/RateLimit-Remaining"
            RateLimit-Reset:
              $ref: "#/components/headers/RateLimit-Reset"
            Access-Control-Allow-Origin:
              $ref: "#/components/headers/Access-Control-Allow-Origin"
          content:
            application/json:
              schema:
                type: array
                maxItems: 200
                items:
                  $ref: "#/components/schemas/Player"
        "400":
          $ref: "#/components/responses/BadRequest"
        "401":
          $ref: "#/components/responses/Unauthorized"
        "429":
          $ref: "#/components/responses/TooManyRequests"
        "500":
          $ref: "#/components/responses/InternalServerError"
    post:
      summary: Create Player
      description: Creates a new player in the roster.
      operationId: createPlayer
      tags:
        - Players
      security:
        - bearerAuth: []
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/PlayerCreate"
      responses:
        "201":
          description: Player created successfully.
          headers:
            RateLimit-Limit:
              $ref: "#/components/headers/RateLimit-Limit"
            RateLimit-Remaining:
              $ref: "#/components/headers/RateLimit-Remaining"
            RateLimit-Reset:
              $ref: "#/components/headers/RateLimit-Reset"
            Access-Control-Allow-Origin:
              $ref: "#/components/headers/Access-Control-Allow-Origin"
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Player"
        "400":
          $ref: "#/components/responses/BadRequest"
        "409":
          $ref: "#/components/responses/Conflict"
        "401":
          $ref: "#/components/responses/Unauthorized"
        "429":
          $ref: "#/components/responses/TooManyRequests"
        "500":
          $ref: "#/components/responses/InternalServerError"

  /players/{playerId}:
    get:
      summary: Get Player Details
      description: Returns details for a single player.
      operationId: getPlayer
      tags:
        - Players
      parameters:
        - name: playerId
          in: path
          required: true
          schema:
            type: string
            format: uuid
            maxLength: 36
            description: UUID v7, time-ordered identifier.
      responses:
        "200":
          description: Player details.
          headers:
            RateLimit-Limit:
              $ref: "#/components/headers/RateLimit-Limit"
            RateLimit-Remaining:
              $ref: "#/components/headers/RateLimit-Remaining"
            RateLimit-Reset:
              $ref: "#/components/headers/RateLimit-Reset"
            Access-Control-Allow-Origin:
              $ref: "#/components/headers/Access-Control-Allow-Origin"
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Player"
        "400":
          $ref: "#/components/responses/BadRequest"
        "401":
          $ref: "#/components/responses/Unauthorized"
        "404":
          $ref: "#/components/responses/NotFound"
        "429":
          $ref: "#/components/responses/TooManyRequests"
        "500":
          $ref: "#/components/responses/InternalServerError"
    put:
      summary: Update Player
      description: Updates player profile fields and status.
      operationId: updatePlayer
      tags:
        - Players
      security:
        - bearerAuth: []
      parameters:
        - name: playerId
          in: path
          required: true
          schema:
            type: string
            format: uuid
            maxLength: 36
            description: UUID v7, time-ordered identifier.
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/PlayerUpdate"
      responses:
        "200":
          description: Player updated successfully.
          headers:
            RateLimit-Limit:
              $ref: "#/components/headers/RateLimit-Limit"
            RateLimit-Remaining:
              $ref: "#/components/headers/RateLimit-Remaining"
            RateLimit-Reset:
              $ref: "#/components/headers/RateLimit-Reset"
            Access-Control-Allow-Origin:
              $ref: "#/components/headers/Access-Control-Allow-Origin"
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Player"
        "400":
          $ref: "#/components/responses/BadRequest"
        "404":
          $ref: "#/components/responses/NotFound"
        "401":
          $ref: "#/components/responses/Unauthorized"
        "429":
          $ref: "#/components/responses/TooManyRequests"
        "500":
          $ref: "#/components/responses/InternalServerError"

  /rounds:
    get:
      summary: List Rounds
      description: Returns recent rounds, optionally limited by query parameter.
      operationId: listRounds
      tags:
        - Rounds
      parameters:
        - name: limit
          in: query
          schema:
            type: integer
            format: int32
            minimum: 1
            maximum: 100
          description: Limit the number of rounds returned. Defaults to 20 when omitted.
      responses:
        "200":
          description: A list of recent rounds.
          headers:
            RateLimit-Limit:
              $ref: "#/components/headers/RateLimit-Limit"
            RateLimit-Remaining:
              $ref: "#/components/headers/RateLimit-Remaining"
            RateLimit-Reset:
              $ref: "#/components/headers/RateLimit-Reset"
            Access-Control-Allow-Origin:
              $ref: "#/components/headers/Access-Control-Allow-Origin"
          content:
            application/json:
              schema:
                type: array
                maxItems: 200
                items:
                  $ref: "#/components/schemas/Round"
        "400":
          $ref: "#/components/responses/BadRequest"
        "401":
          $ref: "#/components/responses/Unauthorized"
        "429":
          $ref: "#/components/responses/TooManyRequests"
        "500":
          $ref: "#/components/responses/InternalServerError"
    post:
      summary: Record a Round
      description: Records a completed round and updates leaderboards.
      operationId: createRound
      tags:
        - Rounds
      security:
        - bearerAuth: []
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/RoundCreate"
      responses:
        "201":
          description: Round created successfully.
          headers:
            RateLimit-Limit:
              $ref: "#/components/headers/RateLimit-Limit"
            RateLimit-Remaining:
              $ref: "#/components/headers/RateLimit-Remaining"
            RateLimit-Reset:
              $ref: "#/components/headers/RateLimit-Reset"
            Access-Control-Allow-Origin:
              $ref: "#/components/headers/Access-Control-Allow-Origin"
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Round"
        "400":
          $ref: "#/components/responses/BadRequest"
        "401":
          $ref: "#/components/responses/Unauthorized"
        "429":
          $ref: "#/components/responses/TooManyRequests"
        "500":
          $ref: "#/components/responses/InternalServerError"

  /rounds/latest:
    get:
      summary: Get Most Recent Round
      description: Returns the most recently created round when available.
      operationId: getLatestRound
      tags:
        - Rounds
      responses:
        "200":
          description: The most recent round or null when no rounds exist.
          headers:
            RateLimit-Limit:
              $ref: "#/components/headers/RateLimit-Limit"
            RateLimit-Remaining:
              $ref: "#/components/headers/RateLimit-Remaining"
            RateLimit-Reset:
              $ref: "#/components/headers/RateLimit-Reset"
            Access-Control-Allow-Origin:
              $ref: "#/components/headers/Access-Control-Allow-Origin"
          content:
            application/json:
              schema:
                oneOf:
                  - $ref: "#/components/schemas/Round"
                  - type: "null"
        "400":
          $ref: "#/components/responses/BadRequest"
        "401":
          $ref: "#/components/responses/Unauthorized"
        "429":
          $ref: "#/components/responses/TooManyRequests"
        "500":
          $ref: "#/components/responses/InternalServerError"

  /rounds/{roundId}:
    get:
      summary: Get Round Details
      description: Returns the details of a specific round.
      operationId: getRound
      tags:
        - Rounds
      parameters:
        - name: roundId
          in: path
          required: true
          schema:
            type: string
            format: uuid
            maxLength: 36
            description: UUID v7, time-ordered identifier.
      responses:
        "200":
          description: Round details.
          headers:
            RateLimit-Limit:
              $ref: "#/components/headers/RateLimit-Limit"
            RateLimit-Remaining:
              $ref: "#/components/headers/RateLimit-Remaining"
            RateLimit-Reset:
              $ref: "#/components/headers/RateLimit-Reset"
            Access-Control-Allow-Origin:
              $ref: "#/components/headers/Access-Control-Allow-Origin"
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Round"
        "400":
          $ref: "#/components/responses/BadRequest"
        "401":
          $ref: "#/components/responses/Unauthorized"
        "404":
          $ref: "#/components/responses/NotFound"
        "429":
          $ref: "#/components/responses/TooManyRequests"
        "500":
          $ref: "#/components/responses/InternalServerError"
    put:
      summary: Edit a Round (within 24h)
      description: Updates round participants or the recorded loser within the edit window.
      operationId: updateRound
      tags:
        - Rounds
      security:
        - bearerAuth: []
      parameters:
        - name: roundId
          in: path
          required: true
          schema:
            type: string
            format: uuid
            maxLength: 36
            description: UUID v7, time-ordered identifier.
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/RoundUpdate"
      responses:
        "200":
          description: Round updated successfully.
          headers:
            RateLimit-Limit:
              $ref: "#/components/headers/RateLimit-Limit"
            RateLimit-Remaining:
              $ref: "#/components/headers/RateLimit-Remaining"
            RateLimit-Reset:
              $ref: "#/components/headers/RateLimit-Reset"
            Access-Control-Allow-Origin:
              $ref: "#/components/headers/Access-Control-Allow-Origin"
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Round"
        "400":
          $ref: "#/components/responses/BadRequest"
        "403":
          $ref: "#/components/responses/Forbidden"
        "404":
          $ref: "#/components/responses/NotFound"
        "409":
          $ref: "#/components/responses/Conflict"
        "401":
          $ref: "#/components/responses/Unauthorized"
        "429":
          $ref: "#/components/responses/TooManyRequests"
        "500":
          $ref: "#/components/responses/InternalServerError"
    delete:
      summary: Soft Delete a Round (within 24h)
      description: Soft-deletes a round and removes it from leaderboards.
      operationId: deleteRound
      tags:
        - Rounds
      security:
        - bearerAuth: []
      parameters:
        - name: roundId
          in: path
          required: true
          schema:
            type: string
            format: uuid
            maxLength: 36
            description: UUID v7, time-ordered identifier.
      responses:
        "204":
          description: Round deleted successfully.
          headers:
            RateLimit-Limit:
              $ref: "#/components/headers/RateLimit-Limit"
            RateLimit-Remaining:
              $ref: "#/components/headers/RateLimit-Remaining"
            RateLimit-Reset:
              $ref: "#/components/headers/RateLimit-Reset"
            Access-Control-Allow-Origin:
              $ref: "#/components/headers/Access-Control-Allow-Origin"
        "400":
          $ref: "#/components/responses/BadRequest"
        "403":
          $ref: "#/components/responses/Forbidden"
        "404":
          $ref: "#/components/responses/NotFound"
        "401":
          $ref: "#/components/responses/Unauthorized"
        "429":
          $ref: "#/components/responses/TooManyRequests"
        "500":
          $ref: "#/components/responses/InternalServerError"

  /fettmattis:
    get:
      summary: List Fettmattis Entries
      description: Returns recent Fettmattis awards.
      operationId: listFettmattis
      tags:
        - Fettmattis
      parameters:
        - name: limit
          in: query
          schema:
            type: integer
            format: int32
            minimum: 1
            maximum: 100
          description: Limit the number of Fettmattis entries returned. Defaults to 20 when omitted.
      responses:
        "200":
          description: A list of recent Fettmattis entries.
          headers:
            RateLimit-Limit:
              $ref: "#/components/headers/RateLimit-Limit"
            RateLimit-Remaining:
              $ref: "#/components/headers/RateLimit-Remaining"
            RateLimit-Reset:
              $ref: "#/components/headers/RateLimit-Reset"
            Access-Control-Allow-Origin:
              $ref: "#/components/headers/Access-Control-Allow-Origin"
          content:
            application/json:
              schema:
                type: array
                maxItems: 200
                items:
                  $ref: "#/components/schemas/Fettmattis"
        "400":
          $ref: "#/components/responses/BadRequest"
        "401":
          $ref: "#/components/responses/Unauthorized"
        "429":
          $ref: "#/components/responses/TooManyRequests"
        "500":
          $ref: "#/components/responses/InternalServerError"
    post:
      summary: Create Fettmattis
      description: Grants a Fettmattis award to a player.
      operationId: createFettmattis
      tags:
        - Fettmattis
      security:
        - bearerAuth: []
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/FettmattisCreate"
      responses:
        "201":
          description: Fettmattis created successfully.
          headers:
            RateLimit-Limit:
              $ref: "#/components/headers/RateLimit-Limit"
            RateLimit-Remaining:
              $ref: "#/components/headers/RateLimit-Remaining"
            RateLimit-Reset:
              $ref: "#/components/headers/RateLimit-Reset"
            Access-Control-Allow-Origin:
              $ref: "#/components/headers/Access-Control-Allow-Origin"
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Fettmattis"
        "400":
          $ref: "#/components/responses/BadRequest"
        "409":
          $ref: "#/components/responses/Conflict"
        "401":
          $ref: "#/components/responses/Unauthorized"
        "429":
          $ref: "#/components/responses/TooManyRequests"
        "500":
          $ref: "#/components/responses/InternalServerError"

  /fettmattis/{fettmattisId}:
    delete:
      summary: Delete Fettmattis (within 24h)
      description: Revokes a Fettmattis award within the edit window.
      operationId: deleteFettmattis
      tags:
        - Fettmattis
      security:
        - bearerAuth: []
      parameters:
        - name: fettmattisId
          in: path
          required: true
          schema:
            type: string
            format: uuid
            maxLength: 36
            description: UUID v7, time-ordered identifier.
      responses:
        "204":
          description: Fettmattis revoked successfully.
          headers:
            RateLimit-Limit:
              $ref: "#/components/headers/RateLimit-Limit"
            RateLimit-Remaining:
              $ref: "#/components/headers/RateLimit-Remaining"
            RateLimit-Reset:
              $ref: "#/components/headers/RateLimit-Reset"
            Access-Control-Allow-Origin:
              $ref: "#/components/headers/Access-Control-Allow-Origin"
        "400":
          $ref: "#/components/responses/BadRequest"
        "403":
          $ref: "#/components/responses/Forbidden"
        "404":
          $ref: "#/components/responses/NotFound"
        "401":
          $ref: "#/components/responses/Unauthorized"
        "429":
          $ref: "#/components/responses/TooManyRequests"
        "500":
          $ref: "#/components/responses/InternalServerError"

  /leaderboard/regular:
    get:
      summary: Get Regular Leaderboard
      description: Returns leaderboard standings for regular play.
      operationId: getRegularLeaderboard
      tags:
        - Leaderboards
      parameters:
        - name: year
          in: query
          schema:
            oneOf:
              - type: integer
                format: int32
                minimum: 1900
                maximum: 2100
              - type: string
                enum:
                  - all
          description: Filter results by season; use "all" to view the all-time leaderboard.
      responses:
        "200":
          description: The regular season leaderboard.
          headers:
            RateLimit-Limit:
              $ref: "#/components/headers/RateLimit-Limit"
            RateLimit-Remaining:
              $ref: "#/components/headers/RateLimit-Remaining"
            RateLimit-Reset:
              $ref: "#/components/headers/RateLimit-Reset"
            Access-Control-Allow-Origin:
              $ref: "#/components/headers/Access-Control-Allow-Origin"
          content:
            application/json:
              schema:
                type: array
                maxItems: 200
                items:
                  $ref: "#/components/schemas/RegularLeaderboardItem"
        "400":
          $ref: "#/components/responses/BadRequest"
        "401":
          $ref: "#/components/responses/Unauthorized"
        "429":
          $ref: "#/components/responses/TooManyRequests"
        "500":
          $ref: "#/components/responses/InternalServerError"

  /leaderboard/fettmattis:
    get:
      summary: Get Fettmattis Leaderboard
      description: Returns leaderboard standings for Fettmattis awards.
      operationId: getFettmattisLeaderboard
      tags:
        - Leaderboards
      parameters:
        - name: year
          in: query
          schema:
            oneOf:
              - type: integer
                format: int32
                minimum: 1900
                maximum: 2100
              - type: string
                enum:
                  - all
          description: Filter results by season; use "all" to view the all-time leaderboard.
      responses:
        "200":
          description: The Fettmattis leaderboard.
          headers:
            RateLimit-Limit:
              $ref: "#/components/headers/RateLimit-Limit"
            RateLimit-Remaining:
              $ref: "#/components/headers/RateLimit-Remaining"
            RateLimit-Reset:
              $ref: "#/components/headers/RateLimit-Reset"
            Access-Control-Allow-Origin:
              $ref: "#/components/headers/Access-Control-Allow-Origin"
          content:
            application/json:
              schema:
                type: array
                maxItems: 200
                items:
                  $ref: "#/components/schemas/FettmattisLeaderboardItem"
        "400":
          $ref: "#/components/responses/BadRequest"
        "401":
          $ref: "#/components/responses/Unauthorized"
        "429":
          $ref: "#/components/responses/TooManyRequests"
        "500":
          $ref: "#/components/responses/InternalServerError"

  /leaderboard/seasons:
    get:
      summary: List Available Leaderboard Seasons
      description: Returns the list of seasons with available leaderboard data.
      operationId: listLeaderboardSeasons
      tags:
        - Leaderboards
      responses:
        "200":
          description: Available leaderboard seasons.
          headers:
            RateLimit-Limit:
              $ref: "#/components/headers/RateLimit-Limit"
            RateLimit-Remaining:
              $ref: "#/components/headers/RateLimit-Remaining"
            RateLimit-Reset:
              $ref: "#/components/headers/RateLimit-Reset"
            Access-Control-Allow-Origin:
              $ref: "#/components/headers/Access-Control-Allow-Origin"
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/LeaderboardSeasonsResponse"
        "400":
          $ref: "#/components/responses/BadRequest"
        "401":
          $ref: "#/components/responses/Unauthorized"
        "429":
          $ref: "#/components/responses/TooManyRequests"
        "500":
          $ref: "#/components/responses/InternalServerError"

components:
  schemas:
    AuthUser:
      type: object
      required:
        - id
        - email
      properties:
        id:
          type: string
          format: uuid
          maxLength: 36
          description: UUID v7, time-ordered identifier for the authenticated user.
        email:
          type: string
          format: email
          maxLength: 254
        name:
          type: string
          maxLength: 80
          pattern: "^.{1,80}$"
          nullable: true
        image:
          type: string
          format: uri
          maxLength: 2048
          nullable: true
        emailVerified:
          type: boolean
          description: Indicates whether the email address has been verified.
        createdAt:
          type: string
          format: date-time
          maxLength: 30
          description: Timestamp for when the user record was created.
        updatedAt:
          type: string
          format: date-time
          maxLength: 30
          description: Timestamp for the last update to the user record.
    AuthSessionData:
      type: object
      required:
        - token
      properties:
        token:
          type: string
          maxLength: 2048
          pattern: "^\\S{1,2048}$"
          description: Opaque bearer token for authenticated write operations.
        expiresAt:
          type: string
          format: date-time
          maxLength: 30
          description: Expiration timestamp for the session.
        id:
          type: string
          maxLength: 64
          pattern: "^[A-Za-z0-9_-]{1,64}$"
          description: Identifier for the issued session.
        createdAt:
          type: string
          format: date-time
          maxLength: 30
          description: Timestamp for when the session was created.
        updatedAt:
          type: string
          format: date-time
          maxLength: 30
          description: Timestamp for the last update to the session.
    AuthSession:
      type: object
      required:
        - session
        - user
      properties:
        session:
          $ref: "#/components/schemas/AuthSessionData"
        user:
          $ref: "#/components/schemas/AuthUser"
    EmailPasswordSignInRequest:
      type: object
      required:
        - email
        - password
      properties:
        email:
          type: string
          format: email
          maxLength: 254
          description: Email address used for the account.
        password:
          type: string
          format: password
          minLength: 8
          maxLength: 128
          description: Password associated with the email account.
        callbackURL:
          type: string
          format: uri
          maxLength: 2048
          description: Optional URL to redirect to after sign-in completes.
        rememberMe:
          type: boolean
          description: When false, the session expires when the browser is closed.
    EmailPasswordSignInResponse:
      type: object
      required:
        - redirect
        - token
        - user
      properties:
        redirect:
          type: boolean
          description: Indicates whether the client should perform a redirect.
        token:
          type: string
          maxLength: 2048
          pattern: "^\\S{1,2048}$"
          description: Session token that can be exchanged for authenticated requests.
        url:
          type: string
          format: uri
          maxLength: 2048
          nullable: true
          description: Redirect destination when `redirect` is true.
        user:
          $ref: "#/components/schemas/AuthUser"
    SignOutResponse:
      type: object
      required:
        - success
      properties:
        success:
          type: boolean
          description: Indicates that the user session was terminated.
    Player:
      type: object
      required:
        - id
        - display_name
        - active
      properties:
        id:
          type: string
          format: uuid
          maxLength: 36
          description: UUID v7, time-ordered identifier.
        display_name:
          type: string
          maxLength: 64
          pattern: "^.{1,64}$"
        active:
          type: boolean
    PlayerCreate:
      type: object
      required:
        - display_name
      properties:
        display_name:
          type: string
          maxLength: 64
          pattern: "^.{1,64}$"
    PlayerUpdate:
      type: object
      properties:
        display_name:
          type: string
          maxLength: 64
          pattern: "^.{1,64}$"
        active:
          type: boolean

    Round:
      type: object
      required:
        - id
        - created_at
        - participants
        - loser
      properties:
        id:
          type: string
          format: uuid
          maxLength: 36
          description: UUID v7, time-ordered identifier.
        created_at:
          type: string
          format: date-time
          maxLength: 30
        participants:
          type: array
          minItems: 2
          maxItems: 8
          items:
            $ref: "#/components/schemas/Player"
        loser:
          $ref: "#/components/schemas/Player"
    RoundCreate:
      type: object
      required:
        - participant_ids
        - loser_id
      properties:
        participant_ids:
          type: array
          maxItems: 8
          items:
            type: string
            format: uuid
            maxLength: 36
            description: UUID v7, time-ordered identifier.
          minItems: 2
        loser_id:
          type: string
          format: uuid
          maxLength: 36
          description: UUID v7, time-ordered identifier.
    RoundUpdate:
      type: object
      properties:
        participant_ids:
          type: array
          maxItems: 8
          items:
            type: string
            format: uuid
            maxLength: 36
            description: UUID v7, time-ordered identifier.
          minItems: 2
        loser_id:
          type: string
          format: uuid
          maxLength: 36
          description: UUID v7, time-ordered identifier.

    Fettmattis:
      type: object
      required:
        - id
        - player
        - created_at
      properties:
        id:
          type: string
          format: uuid
          maxLength: 36
          description: UUID v7, time-ordered identifier.
        player:
          $ref: "#/components/schemas/Player"
        round_id:
          type: string
          format: uuid
          maxLength: 36
          description: UUID v7, time-ordered identifier.
          nullable: true
        created_at:
          type: string
          format: date-time
          maxLength: 30
    FettmattisCreate:
      type: object
      required:
        - player_id
      properties:
        player_id:
          type: string
          format: uuid
          maxLength: 36
          description: UUID v7, time-ordered identifier.
        round_id:
          type: string
          format: uuid
          maxLength: 36
          description: UUID v7, time-ordered identifier.
          nullable: true

    RegularLeaderboardItem:
      type: object
      required:
        - player
        - rank
        - loss_percentage
        - participation_count
        - loss_count
      properties:
        player:
          $ref: "#/components/schemas/Player"
        rank:
          type: integer
          format: int32
          minimum: 1
          maximum: 10000
          nullable: true
        loss_percentage:
          type: number
          format: float
          minimum: 0
          maximum: 1
        participation_count:
          type: integer
          format: int32
          minimum: 0
          maximum: 100000
        loss_count:
          type: integer
          format: int32
          minimum: 0
          maximum: 100000
    FettmattisLeaderboardItem:
      type: object
      required:
        - player
        - rank
        - fettmattis_count
      properties:
        player:
          $ref: "#/components/schemas/Player"
        rank:
          type: integer
          format: int32
          minimum: 1
          maximum: 10000
          nullable: true
        fettmattis_count:
          type: integer
          format: int32
          minimum: 0
          maximum: 100000

    LeaderboardSeasonsResponse:
      type: object
      required:
        - seasons
      properties:
        seasons:
          type: array
          description: Years with leaderboard data available.
          maxItems: 100
          items:
            type: integer
            format: int32
            minimum: 1900
            maximum: 2100

    Problem:
      type: object
      description: RFC 9457 Problem Details
      required:
        - type
        - title
        - status
      properties:
        type:
          type: string
          format: uri
          maxLength: 2048
          default: "about:blank"
        title:
          type: string
          maxLength: 200
          pattern: "^.{1,200}$"
        status:
          type: integer
          format: int32
          minimum: 100
          maximum: 599
        detail:
          type: string
          maxLength: 2000
          pattern: "^.{1,2000}$"
        instance:
          type: string
          format: uri
          maxLength: 2048

  responses:
    BadRequest:
      description: The request body is invalid.
      headers:
        RateLimit-Limit:
          $ref: "#/components/headers/RateLimit-Limit"
        RateLimit-Remaining:
          $ref: "#/components/headers/RateLimit-Remaining"
        RateLimit-Reset:
          $ref: "#/components/headers/RateLimit-Reset"
        Access-Control-Allow-Origin:
          $ref: "#/components/headers/Access-Control-Allow-Origin"
      content:
        application/problem+json:
          schema:
            $ref: "#/components/schemas/Problem"
    Unauthorized:
      description: Authentication is required for this operation.
      headers:
        RateLimit-Limit:
          $ref: "#/components/headers/RateLimit-Limit"
        RateLimit-Remaining:
          $ref: "#/components/headers/RateLimit-Remaining"
        RateLimit-Reset:
          $ref: "#/components/headers/RateLimit-Reset"
        Access-Control-Allow-Origin:
          $ref: "#/components/headers/Access-Control-Allow-Origin"
      content:
        application/problem+json:
          schema:
            $ref: "#/components/schemas/Problem"
    NotFound:
      description: The requested resource was not found.
      headers:
        RateLimit-Limit:
          $ref: "#/components/headers/RateLimit-Limit"
        RateLimit-Remaining:
          $ref: "#/components/headers/RateLimit-Remaining"
        RateLimit-Reset:
          $ref: "#/components/headers/RateLimit-Reset"
        Access-Control-Allow-Origin:
          $ref: "#/components/headers/Access-Control-Allow-Origin"
      content:
        application/problem+json:
          schema:
            $ref: "#/components/schemas/Problem"
    Forbidden:
      description: The action is forbidden, e.g., editing an item outside the 24h window.
      headers:
        RateLimit-Limit:
          $ref: "#/components/headers/RateLimit-Limit"
        RateLimit-Remaining:
          $ref: "#/components/headers/RateLimit-Remaining"
        RateLimit-Reset:
          $ref: "#/components/headers/RateLimit-Reset"
        Access-Control-Allow-Origin:
          $ref: "#/components/headers/Access-Control-Allow-Origin"
      content:
        application/problem+json:
          schema:
            $ref: "#/components/schemas/Problem"
    Conflict:
      description: The resource already exists or the request conflicts with the current state.
      headers:
        RateLimit-Limit:
          $ref: "#/components/headers/RateLimit-Limit"
        RateLimit-Remaining:
          $ref: "#/components/headers/RateLimit-Remaining"
        RateLimit-Reset:
          $ref: "#/components/headers/RateLimit-Reset"
        Access-Control-Allow-Origin:
          $ref: "#/components/headers/Access-Control-Allow-Origin"
      content:
        application/problem+json:
          schema:
            $ref: "#/components/schemas/Problem"
    TooManyRequests:
      description: The client has sent too many requests in a given amount of time.
      headers:
        RateLimit-Limit:
          $ref: "#/components/headers/RateLimit-Limit"
        RateLimit-Remaining:
          $ref: "#/components/headers/RateLimit-Remaining"
        RateLimit-Reset:
          $ref: "#/components/headers/RateLimit-Reset"
        Access-Control-Allow-Origin:
          $ref: "#/components/headers/Access-Control-Allow-Origin"
        Retry-After:
          $ref: "#/components/headers/Retry-After"
      content:
        application/problem+json:
          schema:
            $ref: "#/components/schemas/Problem"
    InternalServerError:
      description: The server encountered an unexpected error.
      headers:
        RateLimit-Limit:
          $ref: "#/components/headers/RateLimit-Limit"
        RateLimit-Remaining:
          $ref: "#/components/headers/RateLimit-Remaining"
        RateLimit-Reset:
          $ref: "#/components/headers/RateLimit-Reset"
        Access-Control-Allow-Origin:
          $ref: "#/components/headers/Access-Control-Allow-Origin"
      content:
        application/problem+json:
          schema:
            $ref: "#/components/schemas/Problem"
  headers:
    Access-Control-Allow-Origin:
      description: Allowed origin for cross-origin requests.
      schema:
        type: string
        maxLength: 2048
        pattern: "^\\S+$"
    RateLimit-Limit:
      description: The maximum number of requests permitted in the current window.
      schema:
        type: integer
        format: int32
        minimum: 0
        maximum: 10000
    RateLimit-Remaining:
      description: The number of remaining requests in the current window.
      schema:
        type: integer
        format: int32
        minimum: 0
        maximum: 10000
    RateLimit-Reset:
      description: Seconds remaining until the rate limit window resets.
      schema:
        type: integer
        format: int32
        minimum: 0
        maximum: 86400
    Retry-After:
      description: Seconds to wait before making a new request.
      schema:
        type: integer
        format: int32
        minimum: 1
        maximum: 86400
  securitySchemes:
    bearerAuth:
      type: http
      scheme: bearer
      bearerFormat: Session
      description: >-
        Session token returned from the authentication endpoints. Present the
        value in the `Authorization` header using the `Bearer` scheme for
        protected write operations or when automating calls from services that
        cannot store cookies.
    sessionCookie:
      type: apiKey
      in: cookie
      name: better-auth.session_token
      description: >-
        Signed session cookie issued during authentication. Present this cookie
        when invoking interactive session endpoints (e.g., inspect or sign out)
        from user agents that manage browser storage. In secure environments the
        cookie is prefixed with `__Secure-`.
