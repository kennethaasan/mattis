openapi: 3.1.0
info:
  title: Mattis Stats API
  version: 1.0.0
  description: |
    API for tracking player statistics for the card game "Mattis".

    **Key Features**:
    - Manage players.
    - Record game rounds and identify a single loser.
    - Grant and revoke special "Fettmattis".
    - View leaderboards for regular play (loss percentage) and Fettmattis.

    **Authentication**:
    - Write operations (`POST`, `PUT`, `DELETE`) require a bearer token issued by the authentication service.
    - Read operations (`GET`) are public.
    - The contract defines both a bearer token scheme for API clients and a cookie-based scheme
      for browser sessions. Use the `bearerAuth` security requirement when automating requests
      or calling protected resources from non-browser clients, and the `sessionCookie` requirement
      when an endpoint expects the signed session cookie provided by BetterAuth during interactive
      login flows.

    **Error Handling**:
    - The API uses RFC 9457 for problem details in error responses.
servers:
  - url: /api
paths:
  /auth/get-session:
    get:
      summary: Get Current Session
      description: Returns the active session when a valid session cookie is present.
      operationId: getSession
      tags:
        - Authentication
      security:
        - sessionCookie: []
      responses:
        "200":
          description: The current session details or null when no session is available.
          content:
            application/json:
              schema:
                oneOf:
                  - $ref: "#/components/schemas/AuthSession"
                  - type: "null"
        "401":
          $ref: "#/components/responses/Unauthorized"

  /auth/sign-in/email:
    post:
      summary: Sign In with Email
      description: Authenticates a user using email and password credentials.
      operationId: signInWithEmail
      tags:
        - Authentication
      security: []
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/EmailPasswordSignInRequest"
      responses:
        "200":
          description: Session token and user details for the authenticated user.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/EmailPasswordSignInResponse"
        "400":
          $ref: "#/components/responses/BadRequest"
        "401":
          $ref: "#/components/responses/Unauthorized"
        "403":
          $ref: "#/components/responses/Forbidden"

  /auth/sign-out:
    post:
      summary: Sign Out
      description: Terminates the current session and clears the associated cookies.
      operationId: signOut
      tags:
        - Authentication
      security:
        - sessionCookie: []
      responses:
        "200":
          description: Confirmation that the session was terminated.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/SignOutResponse"
        "400":
          $ref: "#/components/responses/BadRequest"
  /players:
    get:
      summary: List Players
      operationId: listPlayers
      tags:
        - Players
      security: []
      responses:
        "200":
          description: A list of players.
          content:
            application/json:
              schema:
                type: array
                items:
                  $ref: "#/components/schemas/Player"
    post:
      summary: Create Player
      operationId: createPlayer
      tags:
        - Players
      security:
        - bearerAuth: []
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/PlayerCreate"
      responses:
        "201":
          description: Player created successfully.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Player"
        "400":
          $ref: "#/components/responses/BadRequest"
        "409":
          $ref: "#/components/responses/Conflict"
        "401":
          $ref: "#/components/responses/Unauthorized"

  /players/{playerId}:
    get:
      summary: Get Player Details
      operationId: getPlayer
      tags:
        - Players
      security: []
      parameters:
        - name: playerId
          in: path
          required: true
          schema:
            type: string
            format: uuid
            description: UUID v7, time-ordered identifier.
      responses:
        "200":
          description: Player details.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Player"
        "404":
          $ref: "#/components/responses/NotFound"
    put:
      summary: Update Player
      operationId: updatePlayer
      tags:
        - Players
      security:
        - bearerAuth: []
      parameters:
        - name: playerId
          in: path
          required: true
          schema:
            type: string
            format: uuid
            description: UUID v7, time-ordered identifier.
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/PlayerUpdate"
      responses:
        "200":
          description: Player updated successfully.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Player"
        "400":
          $ref: "#/components/responses/BadRequest"
        "404":
          $ref: "#/components/responses/NotFound"
        "401":
          $ref: "#/components/responses/Unauthorized"

  /rounds:
    get:
      summary: List Rounds
      operationId: listRounds
      tags:
        - Rounds
      security: []
      parameters:
        - name: limit
          in: query
          schema:
            type: integer
            minimum: 1
            maximum: 100
          description: Limit the number of rounds returned. Defaults to 20 when omitted.
      responses:
        "200":
          description: A list of recent rounds.
          content:
            application/json:
              schema:
                type: array
                items:
                  $ref: "#/components/schemas/Round"
    post:
      summary: Record a Round
      operationId: createRound
      tags:
        - Rounds
      security:
        - bearerAuth: []
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/RoundCreate"
      responses:
        "201":
          description: Round created successfully.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Round"
        "400":
          $ref: "#/components/responses/BadRequest"
        "401":
          $ref: "#/components/responses/Unauthorized"

  /rounds/latest:
    get:
      summary: Get Most Recent Round
      description: Returns the most recently created round when available.
      operationId: getLatestRound
      tags:
        - Rounds
      security: []
      responses:
        "200":
          description: The most recent round or null when no rounds exist.
          content:
            application/json:
              schema:
                oneOf:
                  - $ref: "#/components/schemas/Round"
                  - type: "null"

  /rounds/{roundId}:
    get:
      summary: Get Round Details
      operationId: getRound
      tags:
        - Rounds
      security: []
      parameters:
        - name: roundId
          in: path
          required: true
          schema:
            type: string
            format: uuid
            description: UUID v7, time-ordered identifier.
      responses:
        "200":
          description: Round details.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Round"
        "404":
          $ref: "#/components/responses/NotFound"
    put:
      summary: Edit a Round (within 24h)
      operationId: updateRound
      tags:
        - Rounds
      security:
        - bearerAuth: []
      parameters:
        - name: roundId
          in: path
          required: true
          schema:
            type: string
            format: uuid
            description: UUID v7, time-ordered identifier.
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/RoundUpdate"
      responses:
        "200":
          description: Round updated successfully.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Round"
        "400":
          $ref: "#/components/responses/BadRequest"
        "403":
          $ref: "#/components/responses/Forbidden"
        "404":
          $ref: "#/components/responses/NotFound"
        "409":
          $ref: "#/components/responses/Conflict"
        "401":
          $ref: "#/components/responses/Unauthorized"
    delete:
      summary: Soft Delete a Round (within 24h)
      operationId: deleteRound
      tags:
        - Rounds
      security:
        - bearerAuth: []
      parameters:
        - name: roundId
          in: path
          required: true
          schema:
            type: string
            format: uuid
            description: UUID v7, time-ordered identifier.
      responses:
        "204":
          description: Round deleted successfully.
        "403":
          $ref: "#/components/responses/Forbidden"
        "404":
          $ref: "#/components/responses/NotFound"
        "401":
          $ref: "#/components/responses/Unauthorized"

  /fettmattis:
    get:
      summary: List FettMattis Entries
      operationId: listFettmattis
      tags:
        - FettMattis
      security: []
      parameters:
        - name: limit
          in: query
          schema:
            type: integer
            minimum: 1
            maximum: 100
          description: Limit the number of FettMattis entries returned. Defaults to 20 when omitted.
      responses:
        "200":
          description: A list of recent FettMattis entries.
          content:
            application/json:
              schema:
                type: array
                items:
                  $ref: "#/components/schemas/FettMattis"
    post:
      summary: Create FettMattis
      operationId: createFettmattis
      tags:
        - FettMattis
      security:
        - bearerAuth: []
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/FettMattisCreate"
      responses:
        "201":
          description: FettMattis created successfully.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/FettMattis"
        "400":
          $ref: "#/components/responses/BadRequest"
        "409":
          $ref: "#/components/responses/Conflict"
        "401":
          $ref: "#/components/responses/Unauthorized"

  /fettmattis/{fettmattisId}:
    delete:
      summary: Delete FettMattis (within 24h)
      operationId: deleteFettmattis
      tags:
        - FettMattis
      security:
        - bearerAuth: []
      parameters:
        - name: fettmattisId
          in: path
          required: true
          schema:
            type: string
            format: uuid
            description: UUID v7, time-ordered identifier.
      responses:
        "204":
          description: FettMattis revoked successfully.
        "403":
          $ref: "#/components/responses/Forbidden"
        "404":
          $ref: "#/components/responses/NotFound"
        "401":
          $ref: "#/components/responses/Unauthorized"

  /leaderboard/regular:
    get:
      summary: Get Regular Leaderboard
      operationId: getRegularLeaderboard
      tags:
        - Leaderboards
      security: []
      parameters:
        - name: year
          in: query
          schema:
            oneOf:
              - type: integer
              - type: string
                enum:
                  - all
          description: Filter results by season; use "all" to view the all-time leaderboard.
      responses:
        "200":
          description: The regular season leaderboard.
          content:
            application/json:
              schema:
                type: array
                items:
                  $ref: "#/components/schemas/RegularLeaderboardItem"

  /leaderboard/fettmattis:
    get:
      summary: Get Fettmattis Leaderboard
      operationId: getFettmattisLeaderboard
      tags:
        - Leaderboards
      security: []
      parameters:
        - name: year
          in: query
          schema:
            oneOf:
              - type: integer
              - type: string
                enum:
                  - all
          description: Filter results by season; use "all" to view the all-time leaderboard.
      responses:
        "200":
          description: The Fettmattis leaderboard.
          content:
            application/json:
              schema:
                type: array
                items:
                  $ref: "#/components/schemas/FettmattisLeaderboardItem"

  /leaderboard/seasons:
    get:
      summary: List Available Leaderboard Seasons
      operationId: listLeaderboardSeasons
      tags:
        - Leaderboards
      security: []
      responses:
        "200":
          description: Available leaderboard seasons.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/LeaderboardSeasonsResponse"

components:
  schemas:
    AuthUser:
      type: object
      required:
        - id
        - email
      properties:
        id:
          type: string
          format: uuid
          description: UUID v7, time-ordered identifier for the authenticated user.
        email:
          type: string
          format: email
        name:
          type: string
          nullable: true
        image:
          type: string
          format: uri
          nullable: true
        emailVerified:
          type: boolean
          description: Indicates whether the email address has been verified.
        createdAt:
          type: string
          format: date-time
          description: Timestamp for when the user record was created.
        updatedAt:
          type: string
          format: date-time
          description: Timestamp for the last update to the user record.
    AuthSessionData:
      type: object
      required:
        - token
      properties:
        token:
          type: string
          description: Opaque bearer token for authenticated write operations.
        expiresAt:
          type: string
          format: date-time
          description: Expiration timestamp for the session.
        id:
          type: string
          description: Identifier for the issued session.
        createdAt:
          type: string
          format: date-time
          description: Timestamp for when the session was created.
        updatedAt:
          type: string
          format: date-time
          description: Timestamp for the last update to the session.
    AuthSession:
      type: object
      required:
        - session
        - user
      properties:
        session:
          $ref: "#/components/schemas/AuthSessionData"
        user:
          $ref: "#/components/schemas/AuthUser"
    EmailPasswordSignInRequest:
      type: object
      required:
        - email
        - password
      properties:
        email:
          type: string
          format: email
          description: Email address used for the account.
        password:
          type: string
          format: password
          description: Password associated with the email account.
        callbackURL:
          type: string
          format: uri
          description: Optional URL to redirect to after sign-in completes.
        rememberMe:
          type: boolean
          description: When false, the session expires when the browser is closed.
    EmailPasswordSignInResponse:
      type: object
      required:
        - redirect
        - token
        - user
      properties:
        redirect:
          type: boolean
          description: Indicates whether the client should perform a redirect.
        token:
          type: string
          description: Session token that can be exchanged for authenticated requests.
        url:
          type: string
          format: uri
          nullable: true
          description: Redirect destination when `redirect` is true.
        user:
          $ref: "#/components/schemas/AuthUser"
    SignOutResponse:
      type: object
      required:
        - success
      properties:
        success:
          type: boolean
          description: Indicates that the user session was terminated.
    Player:
      type: object
      required:
        - id
        - display_name
        - active
      properties:
        id:
          type: string
          format: uuid
          description: UUID v7, time-ordered identifier.
        display_name:
          type: string
        active:
          type: boolean
    PlayerCreate:
      type: object
      required:
        - display_name
      properties:
        display_name:
          type: string
    PlayerUpdate:
      type: object
      properties:
        display_name:
          type: string
        active:
          type: boolean

    Round:
      type: object
      required:
        - id
        - created_at
        - participants
        - loser
      properties:
        id:
          type: string
          format: uuid
          description: UUID v7, time-ordered identifier.
        created_at:
          type: string
          format: date-time
        participants:
          type: array
          items:
            $ref: "#/components/schemas/Player"
        loser:
          $ref: "#/components/schemas/Player"
    RoundCreate:
      type: object
      required:
        - participant_ids
        - loser_id
      properties:
        participant_ids:
          type: array
          items:
            type: string
            format: uuid
            description: UUID v7, time-ordered identifier.
          minItems: 2
        loser_id:
          type: string
          format: uuid
          description: UUID v7, time-ordered identifier.
    RoundUpdate:
      type: object
      properties:
        participant_ids:
          type: array
          items:
            type: string
            format: uuid
            description: UUID v7, time-ordered identifier.
          minItems: 2
        loser_id:
          type: string
          format: uuid
          description: UUID v7, time-ordered identifier.

    FettMattis:
      type: object
      required:
        - id
        - player
        - created_at
      properties:
        id:
          type: string
          format: uuid
          description: UUID v7, time-ordered identifier.
        player:
          $ref: "#/components/schemas/Player"
        round_id:
          type: string
          format: uuid
          description: UUID v7, time-ordered identifier.
          nullable: true
        created_at:
          type: string
          format: date-time
    FettMattisCreate:
      type: object
      required:
        - player_id
      properties:
        player_id:
          type: string
          format: uuid
          description: UUID v7, time-ordered identifier.
        round_id:
          type: string
          format: uuid
          description: UUID v7, time-ordered identifier.
          nullable: true

    RegularLeaderboardItem:
      type: object
      required:
        - player
        - rank
        - loss_percentage
        - participation_count
        - loss_count
      properties:
        player:
          $ref: "#/components/schemas/Player"
        rank:
          type: integer
        loss_percentage:
          type: number
          format: float
        participation_count:
          type: integer
        loss_count:
          type: integer
    FettmattisLeaderboardItem:
      type: object
      required:
        - player
        - rank
        - fettmattis_count
      properties:
        player:
          $ref: "#/components/schemas/Player"
        rank:
          type: integer
        fettmattis_count:
          type: integer

    LeaderboardSeasonsResponse:
      type: object
      required:
        - seasons
      properties:
        seasons:
          type: array
          description: Years with leaderboard data available.
          items:
            type: integer

    Problem:
      type: object
      description: RFC 9457 Problem Details
      required:
        - type
        - title
        - status
      properties:
        type:
          type: string
          format: uri
          default: "about:blank"
        title:
          type: string
        status:
          type: integer
        detail:
          type: string
        instance:
          type: string
          format: uri

  responses:
    BadRequest:
      description: The request body is invalid.
      content:
        application/problem+json:
          schema:
            $ref: "#/components/schemas/Problem"
    Unauthorized:
      description: Authentication is required for this operation.
      content:
        application/problem+json:
          schema:
            $ref: "#/components/schemas/Problem"
    NotFound:
      description: The requested resource was not found.
      content:
        application/problem+json:
          schema:
            $ref: "#/components/schemas/Problem"
    Forbidden:
      description: The action is forbidden, e.g., editing an item outside the 24h window.
      content:
        application/problem+json:
          schema:
            $ref: "#/components/schemas/Problem"
    Conflict:
      description: The resource already exists or the request conflicts with the current state.
      content:
        application/problem+json:
          schema:
            $ref: "#/components/schemas/Problem"
  securitySchemes:
    bearerAuth:
      type: http
      scheme: bearer
      bearerFormat: Session
      description: >-
        Session token returned from the authentication endpoints. Present the
        value in the `Authorization` header using the `Bearer` scheme for
        protected write operations or when automating calls from services that
        cannot store cookies.
    sessionCookie:
      type: apiKey
      in: cookie
      name: better-auth.session_token
      description: >-
        Signed session cookie issued during authentication. Present this cookie
        when invoking interactive session endpoints (e.g., inspect or sign out)
        from user agents that manage browser storage. In secure environments the
        cookie is prefixed with `__Secure-`.
