name: Build and Validate

on:
  push:
    branches:
      - main
      - develop
      - "feature/**"
      - "bugfix/**"
  pull_request:
    branches:
      - main
      - develop

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: read

defaults:
  run:
    shell: bash

jobs:
  quality-checks:
    name: Lint, Test & Validate Terraform
    runs-on: ubuntu-latest
    timeout-minutes: 20

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4
        with:
          fetch-depth: 1

      - name: Setup Node.js 22.x
        uses: actions/setup-node@v4
        with:
          node-version: 22.x
          cache: npm
          cache-dependency-path: |
            package-lock.json

      - name: Install dependencies
        run: npm ci

      - name: Formatting Check (Prettier)
        run: npm run prettier:check
        timeout-minutes: 3

      - name: Lint (ESLint)
        run: npm run lint
        timeout-minutes: 6

      - name: Type Check (TypeScript)
        run: npm run tsc
        timeout-minutes: 6

      - name: Tests
        run: npm test
        timeout-minutes: 6

      - name: Dependency Review
        if: github.event_name == 'pull_request'
        uses: actions/dependency-review-action@v4

      - name: Create OpenNext stub bundle
        run: |
          mkdir -p .open-next/server-function
          cat <<'JS' > .open-next/server-function/index.mjs
          export const handler = async () => ({
            statusCode: 200,
            headers: { 'content-type': 'text/plain' },
            body: 'ok',
          });
          JS

      - name: Setup Terraform
        uses: hashicorp/setup-terraform@v3
        with:
          terraform_version: 1.13.3

      - name: Check Terraform formatting
        working-directory: iac
        run: terraform fmt -check -recursive

      - name: Terraform validate
        working-directory: iac
        env:
          TF_VAR_neon_api_key: dummy
        run: |
          terraform init -backend=false
          terraform validate

      - name: Setup TFLint
        uses: terraform-linters/setup-tflint@v3

      - name: Run TFLint
        working-directory: iac
        run: |
          tflint --init
          tflint --minimum-failure-severity=error

      - name: Run Trivy config scan
        uses: aquasecurity/trivy-action@0.24.0
        with:
          scan-type: config
          scan-ref: iac
          exit-code: '1'
          ignore-unfixed: true
          severity: HIGH,CRITICAL
          skip-dirs: iac/.terraform

