name: CI/CD Pipeline

on:
  # Run on pushes to main (all 3 jobs)
  push:
    branches: [main]
  # Run on all PRs (test + build)
  pull_request:

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

permissions:
  # Required to checkout the code
  contents: read
  # Required to put a comment into the pull-request
  pull-requests: write

env:
  NODE_VERSION: 22
  TERRAFORM_VERSION: 1.13.3

jobs:
  code-quality:
    name: ${{ matrix.name }}
    runs-on: ubuntu-latest
    timeout-minutes: ${{ matrix.job-timeout }}
    strategy:
      fail-fast: false
      matrix:
        include:
          - name: Type Check (TypeScript)
            command: npm run tsc
            job-timeout: 15
          - name: Lint (Biome)
            command: npm run lint
            job-timeout: 15
    steps:
      - name: Checkout repository
        uses: actions/checkout@v5

      - &setup-node
        name: Setup Node.js
        uses: actions/setup-node@v5
        with:
          node-version: ${{ env.NODE_VERSION }}

      - &install-dependencies
        name: Install dependencies
        run: npm ci

      - name: Run ${{ matrix.name }}
        run: ${{ matrix.command }}

  unit-tests:
    name: Tests
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - name: Checkout repository
        uses: actions/checkout@v5

      - *setup-node

      - *install-dependencies

      - name: Tests
        run: npm test
        timeout-minutes: 10

      - name: "Report Vitest Coverage"
        if: always()
        uses: davelosert/vitest-coverage-report-action@v2

  infra:
    name: Infrastructure checks
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - name: Checkout repository
        uses: actions/checkout@v5

      - name: Setup Terraform
        uses: hashicorp/setup-terraform@v3
        with:
          terraform_version: ${{ env.TERRAFORM_VERSION }}
          cli_config_credentials_token: ${{ secrets.TF_API_TOKEN }}

      - name: Check Terraform formatting
        working-directory: iac
        run: terraform fmt -check -recursive

      - name: Terraform init
        working-directory: iac
        run: terraform init -input=false

      - name: Terraform validate
        working-directory: iac
        run: terraform validate

      - name: Terraform plan
        if: github.event_name == 'pull_request'
        working-directory: iac
        run: terraform plan -input=false

      - name: Setup TFLint
        uses: terraform-linters/setup-tflint@v4

      - name: Run TFLint
        working-directory: iac
        run: |
          tflint --init
          tflint --minimum-failure-severity=error

      # - name: Run Trivy config scan
      #   uses: aquasecurity/trivy-action@0.24.0
      #   with:
      #     scan-type: config
      #     scan-ref: iac
      #     exit-code: "1"
      #     ignore-unfixed: true
      #     severity: HIGH,CRITICAL
      #     skip-dirs: iac/.terraform

  e2e:
    name: End-to-end tests
    runs-on: ubuntu-latest
    timeout-minutes: 15
    services:
      postgres:
        image: postgres:17
        ports:
          - 5432:5432
        env:
          POSTGRES_DB: mattis_db
          POSTGRES_USER: user
          POSTGRES_PASSWORD: password
        options: >-
          --health-cmd "pg_isready -U user -d mattis_db"
          --health-interval 10s
          --health-timeout 5s
          --health-retries 5
    env:
      DATABASE_URL: postgresql://user:password@127.0.0.1:5432/mattis_db
      BASIC_AUTH_USERNAME: admin
      BASIC_AUTH_PASSWORD: admin
      BASIC_AUTH_USER_ID: 00000000-0000-7000-8000-000000000000
      PLAYWRIGHT_BASE_URL: http://127.0.0.1:3000
    steps:
      - name: Checkout repository
        uses: actions/checkout@v5

      - *setup-node

      - *install-dependencies

      - name: Seed database
        run: npm run seed

      - name: Install Playwright Browsers
        run: npx playwright install --with-deps chromium

      - name: Run Playwright tests
        run: npm run test:e2e

      - name: Upload Playwright report
        uses: actions/upload-artifact@v4
        with:
          name: playwright-report
          path: reports/playwright/
          retention-days: 30

      - name: Dependency Review
        if: github.event_name == 'pull_request'
        uses: actions/dependency-review-action@v4

  build:
    name: Build
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - name: Checkout repository
        uses: actions/checkout@v5
      - *setup-node
      - *install-dependencies
      - name: Build and package Lambda function
        run: npm run build:lambda
      - name: Zip Lambda function
        run: zip -r build/function.zip build/*
      # Upload build artifacts for deploy (only on push to main)
      - name: Upload Lambda artifact
        if: ${{ github.event_name == 'push' && github.ref_name == 'main' }}
        uses: actions/upload-artifact@v4
        with:
          name: lambda-function
          path: build/function.zip
          if-no-files-found: error
          retention-days: 3

  deploy:
    name: Deploy
    runs-on: ubuntu-latest
    needs:
      - code-quality
      - unit-tests
      - infra
      - e2e
      - build
    if: ${{ github.event_name == 'push' && github.ref_name == 'main' }}
    environment: production
    timeout-minutes: 30
    steps:
      - name: Checkout repository
        uses: actions/checkout@v5
      - name: Setup Terraform
        uses: hashicorp/setup-terraform@v3
        with:
          terraform_version: ${{ env.TERRAFORM_VERSION }}
          cli_config_credentials_token: ${{ secrets.TF_API_TOKEN }}
      - name: Download Build Artifacts
        uses: actions/download-artifact@v5
        with:
          name: lambda-function
          path: iac/build

      - name: Terraform init
        working-directory: iac
        run: terraform init -input=false
      - name: Terraform apply
        working-directory: iac
        run: terraform apply -auto-approve -input=false
      - name: Capture Terraform outputs
        id: tf_outputs
        working-directory: iac
        run: |
          echo "database_url=$(terraform output -raw database_url)" >> "$GITHUB_OUTPUT"
      - *setup-node
      - *install-dependencies
      - name: Run database migrations
        env:
          DATABASE_URL: ${{ steps.tf_outputs.outputs.database_url }}
        run: npm run db:migrate
