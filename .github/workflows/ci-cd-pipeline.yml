name: CI/CD Pipeline

on:
  # Run on pushes to main (all 3 jobs)
  push:
    branches: [main]
  # Run on all PRs (test + build)
  pull_request:

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

permissions:
  # Required to checkout the code
  contents: read
  # Required to put a comment into the pull-request
  pull-requests: write

jobs:
  test:
    name: Tests
    runs-on: ubuntu-latest
    timeout-minutes: 35
    services:
      postgres:
        image: postgres:17
        ports:
          - 5432:5432
        env:
          POSTGRES_DB: mattis_db
          POSTGRES_USER: user
          POSTGRES_PASSWORD: password
        options: >-
          --health-cmd "pg_isready -U user -d mattis_db"
          --health-interval 10s
          --health-timeout 5s
          --health-retries 5
    env:
      DATABASE_URL: postgresql://user:password@127.0.0.1:5432/mattis_db
      BASIC_AUTH_USERNAME: admin
      BASIC_AUTH_PASSWORD: admin
      BASIC_AUTH_USER_ID: 00000000-0000-7000-8000-000000000000
      PLAYWRIGHT_BASE_URL: http://127.0.0.1:3000
    steps:
      - name: Checkout repository
        uses: actions/checkout@v5

      - name: Setup Node.js
        uses: actions/setup-node@v5
        with:
          node-version: 22

      - name: Install dependencies
        run: npm ci

      - name: Type Check (TypeScript)
        run: npm run tsc
        timeout-minutes: 6

      - name: Formatting Check (Prettier)
        run: npm run prettier:check
        timeout-minutes: 3

      - name: Lint (ESLint)
        run: npm run lint
        timeout-minutes: 6

      - name: Tests
        run: npm test
        timeout-minutes: 6

      - name: "Report Vitest Coverage"
        if: always()
        uses: davelosert/vitest-coverage-report-action@v2

      - name: Setup Terraform
        uses: hashicorp/setup-terraform@v3
        with:
          terraform_version: 1.13.3

      - name: Check Terraform formatting
        working-directory: iac
        run: terraform fmt -check -recursive

      - name: Terraform validate
        working-directory: iac
        run: |
          terraform init -backend=false
          terraform validate

      - name: Setup TFLint
        uses: terraform-linters/setup-tflint@v4

      - name: Run TFLint
        working-directory: iac
        run: |
          tflint --init
          tflint --minimum-failure-severity=error

      # - name: Run Trivy config scan
      #   uses: aquasecurity/trivy-action@0.24.0
      #   with:
      #     scan-type: config
      #     scan-ref: iac
      #     exit-code: "1"
      #     ignore-unfixed: true
      #     severity: HIGH,CRITICAL
      #     skip-dirs: iac/.terraform

      - name: Create environment file
        run: |
          cat <<EOF_ENV > .env
          DATABASE_URL=${DATABASE_URL}
          BASIC_AUTH_USERNAME=${BASIC_AUTH_USERNAME}
          BASIC_AUTH_PASSWORD=${BASIC_AUTH_PASSWORD}
          BASIC_AUTH_USER_ID=${BASIC_AUTH_USER_ID}
          EOF_ENV

      - name: Seed database
        run: npm run seed

      - name: Install Playwright Browsers
        run: npx playwright install --with-deps chromium

      - name: Run Playwright tests
        run: npm run test:e2e

      - name: Upload Playwright report
        uses: actions/upload-artifact@v4
        with:
          name: playwright-report
          path: reports/playwright/
          retention-days: 30

      - name: Dependency Review
        if: github.event_name == 'pull_request'
        uses: actions/dependency-review-action@v4

  build:
    name: Build
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - name: Checkout repository
        uses: actions/checkout@v5
      - name: Setup Node.js
        uses: actions/setup-node@v5
        with:
          node-version: 22
      - name: Install dependencies
        run: npm ci
      - name: Build
        run: npm run build:open:next
      # Upload build artifacts for deploy (only on push to main)
      - name: Upload build artifact
        if: ${{ github.event_name == 'push' && github.ref_name == 'main' }}
        uses: actions/upload-artifact@v4
        with:
          name: build
          path: .open-next
          if-no-files-found: error
          retention-days: 3
          include-hidden-files: true

  deploy:
    name: Deploy
    runs-on: ubuntu-latest
    needs:
      - test
      - build
    if: ${{ github.event_name == 'push' && github.ref_name == 'main' }}
    environment: production
    timeout-minutes: 30
    steps:
      - name: Checkout repository
        uses: actions/checkout@v5
      - name: Setup Terraform
        uses: hashicorp/setup-terraform@v3
        with:
          terraform_version: 1.13.3
          cli_config_credentials_token: ${{ secrets.TF_API_TOKEN }}
      - name: Download Build Artifacts
        uses: actions/download-artifact@v5
        with:
          name: build
          path: iac/.open-next
      - name: Terraform init
        working-directory: iac
        run: terraform init -input=false
      - name: Terraform plan
        working-directory: iac
        run: terraform plan -out=tfplan -input=false
      # - name: Terraform apply
      #   working-directory: iac
      #   run: terraform apply -auto-approve -input=false tfplan
